<section class="ueber-mich">
  <div class="ueber-wrapper container">

    <div class="ueber-left">
      <h2>{{ 'about.title' | translate }}</h2>

      <p>
        {{ 'about.intro' | translate }}
      </p>

      <ul class="ueber-points">
        <li>
          <img src="assets\icons\Property 1=Location g.svg"
            [alt]="'about.points.location.icon_alt' | translate" />
          <span>{{ 'about.points.location.text' | translate }}</span>
        </li>
        <li>
          <img src="assets/icons/Property 1=Hover G.svg"
            [alt]="'about.points.thinking.icon_alt' | translate" />
          <span>{{ 'about.points.thinking.text' | translate }}</span>
        </li>
        <li>
          <img src="assets/icons/13. puzzle desktop.svg"
            [alt]="'about.points.interests.icon_alt' | translate" />
          <span>{{ 'about.points.interests.text' | translate }}</span>
        </li>
      </ul>
    </div>

    <div class="ueber-right">
      <div class="image-wrapper">
        <img src="assets\img\stitch.png" class="ueber-image" [alt]="'about.profile_alt' | translate" />
        <div class="green-line"></div>
      </div>
    </div>

  </div>
</section>
