<footer class="site-footer">
	<div class="container">
		<div class="footer-left">
			<img
				src="/assets/img/FlosLogo.png"
				[alt]="'footer.logo_alt' | translate"
				width="1024"
				height="1024"
			/>
		</div>

		<div class="footer-center">
			<span>© Florian Weimann 2026</span>
		</div>

		<nav class="footer-right" [attr.aria-label]="'footer.navigation_label' | translate">
			<a
				href="https://github.com/Drangello"
				target="_blank"
				rel="noopener noreferrer"
				[attr.aria-label]="'footer.github_aria' | translate"
			>
				<img
					src="/assets/icons/Property 1=hover.svg"
					alt=""
					aria-hidden="true"
					width="42"
					height="40"
				/>
			</a>
			<a
				href="https://www.linkedin.com/in/florian-weimann-b0357a3a0/"
				target="_blank"
				rel="noopener noreferrer"
				[attr.aria-label]="'footer.linkedin_aria' | translate"
			>
				<img
					src="/assets/icons/Vector.svg"
					alt=""
					aria-hidden="true"
					width="40"
					height="40"
				/>
			</a>
			<a
				href="mailto:kontakt@florianweimann.de"
				[attr.aria-label]="'footer.email_aria' | translate"
			>
				<img
					src="/assets/icons/Property 1=Mail.svg"
					alt=""
					aria-hidden="true"
					width="40"
					height="40"
				/>
			</a>
		</nav>
	</div>
</footer>
